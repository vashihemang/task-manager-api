
name: Task Manager API CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure environment
        run: |
          echo "DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/task_manager" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=ci-test-secret-key-at-least-32-bytes-long" >> $GITHUB_ENV
          echo "TEACHER_REGISTRATION_KEY=" >> $GITHUB_ENV

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
